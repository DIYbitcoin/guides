<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIYbitcoin Guides</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Serif:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
img{max-width:100%;height:auto}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
th,td{padding:8px 10px;text-align:left;vertical-align:top}
pre{position:relative;overflow-x:auto;padding:14px 16px}
pre button.copy{position:absolute;top:8px;right:8px;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 16px}
nav a{text-decoration:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0}
.card{display:block;padding:18px;text-decoration:none}
.card h3{margin:0 0 8px}
.card p{margin:0}
details{margin:12px 0;padding:6px 14px}
summary{cursor:pointer;padding:6px 0}

.t{background:#0a0f0a;color:#b9e5c3;font:15px/1.7 'IBM Plex Mono',ui-monospace,monospace}
.t nav{border-bottom:1px solid #1f3a26;background:#0d140d}
.t nav .prompt{color:#3f7f4f}
.t nav a{color:#7dff9b}
.t nav a.on{background:#7dff9b;color:#0a0f0a;padding:0 6px}
.t h1,.t h2,.t h3{color:#7dff9b;font-weight:600;line-height:1.3}
.t h1::before{content:'> '}
.t h1::after{content:'_';animation:blink 1s steps(1) infinite}
.t h2{border-top:1px dashed #2e5a38;padding-top:22px;margin-top:40px}
.t h2::before{content:'## ';color:#3f7f4f}
.t h3::before{content:'### ';color:#3f7f4f}
@keyframes blink{50%{opacity:0}}
.t a{color:#7dff9b}
.t strong{color:#e6fff0}
.t code{background:#132013;color:#7dff9b;padding:1px 5px}
.t pre{background:#0f1a10;border:1px solid #2e5a38}
.t pre code{background:none;padding:0}
.t pre code.language-bash::before{content:'$ ';color:#3f7f4f}
.t pre button.copy{background:#0a0f0a;color:#7dff9b;border:1px solid #2e5a38;font:12px 'IBM Plex Mono',monospace}
.t th,.t td{border:1px solid #2e5a38}
.t th{color:#7dff9b}
.t img{border:1px solid #2e5a38}
.t details{border:1px solid #2e5a38}
.t summary{color:#7dff9b}
.t summary::marker{content:'[+] '}
.t details[open]>summary::marker{content:'[-] '}
.t blockquote{border-left:3px solid #7dff9b;margin:0;padding-left:14px;color:#8fcf9f}
.t .card{border:1px solid #2e5a38;color:#b9e5c3}
.t .card:hover{border-color:#7dff9b}
.t .card h3::before{content:'$ ';color:#3f7f4f}

.lang{margin-left:auto;position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:#0a0f0a;color:#7dff9b;border:1px solid #2e5a38;font:inherit;padding:2px 10px;cursor:pointer}
.lang-btn:hover,.lang.open .lang-btn{border-color:#7dff9b}
.lang-btn .caret{display:inline-block;transition:transform .25s}
.lang.open .lang-btn .caret{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;margin:0;padding:6px 0;list-style:none;background:#0d140d;border:1px solid #2e5a38;z-index:10;transform-origin:top right;transform:scale(.92) translateY(-6px);opacity:0;visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility .18s}
.lang.open .lang-menu{transform:none;opacity:1;visibility:visible}
.lang-menu li{display:flex;align-items:center;gap:10px;padding:6px 14px;cursor:pointer;color:#b9e5c3}
.lang-menu li:hover,.lang-menu li:focus{background:#132013;color:#7dff9b;outline:none}
.lang-menu li[aria-selected="true"]{color:#7dff9b}
.lang-menu li[aria-selected="true"]::after{content:'<';margin-left:auto}
.lang .fi{border:1px solid #1f3a26}
@media (prefers-reduced-motion:reduce){.lang-menu{transition:none}}

main.docs{max-width:1480px;padding-top:40px}
.docs{--ink:#e6fff0;--muted:#b9e5c3;--dim:#6f9a7a;--line:#1f3a26;--control:#2e5a38;--key:#0f1a10;--accent:#7dff9b;--accent-bg:#132013}
.docs-layout{display:grid;grid-template-columns:230px minmax(0,1fr) auto;gap:56px;align-items:start}
.t .docs-rail{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;margin:0;padding:0;border:0}
.docs-rail>summary{display:none}
.rail-group{margin:0 0 14px}
.t .rail-group{border:0;margin:0 0 14px;padding:0}
.t .rail-group>summary{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;padding:6px 0;color:var(--dim);font-size:12px;letter-spacing:.16em;text-transform:uppercase;user-select:none}
.t .rail-group>summary::marker,.t .rail-group>summary::-webkit-details-marker{content:'';display:none}
.rail-group>summary:hover{color:var(--ink)}
.rail-group[open]>summary{color:var(--muted)}
.rail-group>summary span::before{content:'[ ';color:var(--accent)}
.rail-group>summary span::after{content:' ]';color:var(--accent)}
.rail-ico{flex:none;width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-chev{flex:none;width:13px;height:13px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s}
.rail-group[open]>summary .rail-chev{transform:rotate(180deg)}
.rail-group a{position:relative;display:block;margin:3px 0 3px 0;padding:7px 24px 7px 12px;border:1px solid transparent;border-radius:8px;color:var(--dim);font-size:13px;line-height:1.35;text-decoration:none}
.rail-group a:hover{color:var(--ink);border-color:var(--line);background:var(--key)}
.rail-group a[aria-current]{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.rail-group a.seen::after{content:'';position:absolute;right:10px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--dim)}
.docs-body{min-width:0;max-width:78ch}
.docs-head{margin:0 0 34px;color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.eyebrow{margin:0 0 8px;color:var(--accent);font-size:13px;letter-spacing:.13em;text-transform:uppercase}
.t .docs-body .topic>h1:first-of-type,.t .docs-body .topic>h2:first-of-type{border:0;margin:0 0 18px;padding:0;color:var(--ink);font-size:30px;font-weight:500;line-height:1.2}
.t .docs-body .topic>h1:first-of-type::before,.t .docs-body .topic>h2:first-of-type::before,.t .docs-body .topic>h1:first-of-type::after{content:none}
.docs-body h3{scroll-margin-top:24px}
.t .docs-toc{position:sticky;top:24px;width:220px;max-height:calc(100vh - 48px);overflow-y:auto}
.docs-toc[hidden]{display:none}
.docs-toc p{margin:0 0 12px;color:var(--dim);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.docs-toc a{display:block;border-left:1px solid var(--line);padding:6px 0 6px 12px;color:var(--dim);font-size:13px;line-height:1.4;text-decoration:none}
.docs-toc a:hover{color:var(--ink);border-left-color:var(--control)}
.docs-toc a.is-here{color:var(--accent);border-left-color:var(--accent)}
.docs-pager{display:flex;gap:16px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.docs-pager a{display:block;flex:1;max-width:50%;padding:12px 16px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--muted)}
.docs-pager a:hover{border-color:var(--accent)}
.docs-pager span{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
.docs-pager strong{display:block;margin-top:4px;color:var(--ink);font-weight:500}
.docs-pager .pager-next{margin-left:auto;text-align:right}
@media (max-width:1080px){.docs-layout{grid-template-columns:230px minmax(0,1fr)}.t .docs-toc{display:none}}
@media (max-width:900px){
main.docs{padding-top:20px}
.docs-layout{grid-template-columns:minmax(0,1fr);gap:24px}
.t .docs-rail{position:static;max-height:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.docs-rail>summary{display:list-item;color:var(--accent)}
.t .docs-rail[open]{padding-bottom:12px}
.docs-pager{flex-direction:column}
.docs-pager a{max-width:none}
}
@media (prefers-reduced-motion:reduce){.rail-chev{transition:none}}
</style></head>

const out = document.getElementById('out');
const nav = document.getElementById('nav');
const flagOf = l => LANGS.find(x => x[0] === l)[1];
function drawNav() {

    [['home','home']].concat(T.en.guides.map(g => [g[0], g[0]])).map(([p, l]) => `<a class="${p === page ? 'on' : ''}" href="${href(p)}">${l}</a>`).join('') +

  compass: '<circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5 13.6 13.6 8.5 15.5l1.9-5.1z"/>',
  box: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/>',
  chain: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  bolt: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
};
const GROUPS = {
  javacards: [[1, 'book', 'start'], [3, 'download', 'install'], [7, 'power', 'setup'], [10, 'compass', 'more']],
  signers: [[1, 'book', 'start'], [5, 'download', 'flash'], [8, 'compass', 'more']],
  nodes: [[1, 'book', 'understand'], [6, 'box', 'odroid'], [14, 'chain', 'core'], [17, 'bolt', 'electrs'], [24, 'compass', 'more']],
};
const label = (k, L) => L[k] || T.en[k];
const plain = h => h.replace(/<[^>]+>/g, '').trim();
const noEmoji = s => s.replace(/^[\p{Extended_Pictographic}\p{Emoji_Modifier}️‍⃣#*0-9]*[\p{Extended_Pictographic}️⃣]+\s*/u, '');
/* "Step 5: connect with SSH" reads as "Connect with SSH" in the sidebar;
   the number is already in the label above the title. Names written in
   lower case on purpose (electrs, bitcoin.conf) keep their case. */
const short = s => {
  const e = noEmoji(s), t = e.replace(/^[^\d:：]{0,12}\d+[a-z]?\s*[^\d:：\s]{0,4}\s*[:：]\s*/u, '');
  return t === e || /^(electrs|bitcoin\.conf|bitcoin-cli|config\.toml)\b/.test(t) ? t : t.charAt(0).toUpperCase() + t.slice(1);
};
const svg = k => `<svg class="rail-ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.book}</svg>`;
const CHEV = '<svg class="rail-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

function docsLayout(md, L) {
  const all = marked.lexer(md);
  const topics = [];
  let topic = null, title = '';
  const anchor = t => /^\s*<a id="[^"]+"><\/a>\s*$/.test(t.raw || '');
  const start = (tok, name) => {
    /* "<a id=...>" lines written just above a heading belong to it */
    let moved = [];
    while (topic && topic.body.length && (topic.body.at(-1).type === 'space' || anchor(topic.body.at(-1)))) {
      const t = topic.body.pop();
      if (anchor(t)) moved.unshift(t);
    }
    if (topic && !topic.body.some(t => t.type !== 'space' && !anchor(t) && t !== topic.head)) {
      moved = topic.body.filter(anchor).concat(moved);
      topics.pop();
    }
    topic = {head: tok, name, body: moved.concat(tok)};
    topics.push(topic);
  };
  for (const tok of all) {
    if (tok.type === 'heading' && tok.depth === 1) {
      if (!title) { title = plain(marked.parseInline(tok.text)); start(tok, label('intro', L)); }
      else start(tok, tok.text);
    } else if (tok.type === 'heading' && tok.depth === 2 && topic) {
      start(tok, tok.text);
    } else if (topic) {
      topic.body.push(tok);
    }
  }
  if (!topics.length) return marked.parse(md);
  const plan = GROUPS[page] || [[1, 'book', title]];
  const gname = k => (L.g && L.g[k]) || T.en.g[k] || k;
  const groups = plan.map(([from, icon, key]) => ({from, icon, name: gname(key), topics: []}));
  topics.forEach((t, i) => {
    t.id = 't' + (i + 1);
    t.label = short(plain(marked.parseInline(t.name)));
    t.group = groups.filter(g => g.from <= i + 1).at(-1) || groups[0];
    t.group.topics.push(t);
  });
  const html = toks => { toks.links = all.links; return marked.parser(toks); };
  const rail = groups.filter(g => g.topics.length).map(g =>
    `<details class="rail-group" data-from="${g.from}"><summary>${svg(g.icon)}<span>${g.name}</span>${CHEV}</summary>` +
    g.topics.map(t => `<a href="#${t.id}" data-topic="${t.id}">${t.label}</a>`).join('') + `</details>`).join('');
  const body = topics.map((t, i) => {
    const prev = topics[i - 1], next = topics[i + 1];
    const pager = `<div class="docs-pager">` +
      (prev ? `<a class="pager-prev" href="#${prev.id}"><span>${label('prev', L)}</span><strong>${prev.label}</strong></a>` : '') +
      (next ? `<a class="pager-next" href="#${next.id}"><span>${label('next', L)}</span><strong>${next.label}</strong></a>` : '') + `</div>`;
    const eyebrow = `<p class="eyebrow">${String(i + 1).padStart(2, '0')} / ${t.group.name}</p>`;
    return `<section class="topic" id="${t.id}" hidden>${eyebrow}${html(t.body)}${pager}</section>`;
  }).join('');
  return `<div class="docs-layout">` +
    `<details class="docs-rail"${matchMedia('(max-width:900px)').matches ? '' : ' open'}><summary>${label('topics', L)}</summary>${rail}</details>` +
    `<div class="docs-body"><p class="docs-head">${noEmoji(title)}</p>${body}</div>` +
    `<aside class="docs-toc" hidden></aside></div>`;
}

/* The right column lists what is in the topic on screen: its subheadings,
   its fold out boxes, and the first words of each numbered step. */
function tocEntries(target) {
  const items = [];
  [...target.children].forEach(el => {
    if (el.matches('h3')) items.push([el, el.textContent]);
    else if (el.matches('details')) items.push([el.querySelector('summary'), el.querySelector('summary').textContent]);
    else if (el.matches('ol')) [...el.children].forEach(li => {
      const first = (li.querySelector('p') || li).cloneNode(true);
      first.querySelectorAll('pre, ol, ul, details').forEach(x => x.remove());
      let text = first.textContent.trim().split(/[:：](\s|$)/)[0].split(/(?<=[.。!?])\s/)[0];
      if (text.length > 70) text = text.slice(0, 68).replace(/\s+\S*$/, '') + '…';
      items.push([li, text]);
    });
  });
  return items.map(([el, text]) => [el, noEmoji(text.trim())]).filter(([, text]) => text);
}

const seenKey = () => 'seen:' + page;
function seen() { try { return JSON.parse(localStorage.getItem(seenKey()) || '[]'); } catch (e) { return []; } }
let spy = null;
function showTopic(hash, opened) {
  const sections = [...out.querySelectorAll('.docs-body .topic')];
  if (!sections.length) { const el = hash && document.getElementById(hash); if (el) el.scrollIntoView(); return; }
  const el = hash && document.getElementById(hash);
  const target = (el && el.closest('.topic')) || sections[0];
  sections.forEach(s => { s.hidden = s !== target; });
  const head = target.querySelector('h1, h2');
  if (head && !head.dataset.clean) { head.dataset.clean = 1; const n = head.firstChild; if (n && n.nodeType === 3) n.textContent = noEmoji(n.textContent); }
  const marks = seen();
  if (!marks.includes(target.id)) { marks.push(target.id); try { localStorage.setItem(seenKey(), JSON.stringify(marks)); } catch (e) {} }
  out.querySelectorAll('.rail-group a').forEach(a => {
    a.toggleAttribute('aria-current', a.dataset.topic === target.id);
    a.classList.toggle('seen', marks.includes(a.dataset.topic) && a.dataset.topic !== target.id);
  });
  out.querySelectorAll('.rail-group').forEach(g => { g.open = !!g.querySelector(`a[data-topic="${target.id}"]`); });
  const rail = out.querySelector('.docs-rail');
  if (opened && rail && matchMedia('(max-width:900px)').matches) rail.open = false;
  const toc = out.querySelector('.docs-toc');
  const items = tocEntries(target);
  if (spy) { removeEventListener('scroll', spy); spy = null; }
  if (items.length < 2) { toc.hidden = true; toc.innerHTML = ''; }
  else {
    items.forEach(([e], i) => { if (!e.id) e.id = `${target.id}-${i + 1}`; e.style.scrollMarginTop = '24px'; });
    toc.innerHTML = `<p>${label('onpage', T[lang] || T.en)}</p>` + items.map(([e, text]) => `<a href="#${e.id}">${text}</a>`).join('');
    toc.hidden = false;
    const links = [...toc.querySelectorAll('a')];
    spy = () => {
      let here = 0;
      items.forEach(([e], i) => { if (e.getBoundingClientRect().top < 140) here = i; });
      links.forEach((a, i) => a.classList.toggle('is-here', i === here));
    };
    addEventListener('scroll', spy, {passive: true});
  }
  if (el && el !== target) {
    const box = el.closest('details');
    if (box && !box.open) box.open = true;
    el.scrollIntoView();
  } else {
    window.scrollTo(0, 0);
  }
  /* Keep the current topic in sight when the sidebar is taller than the screen. */
  const cur = rail && rail.querySelector('a[aria-current]');
  if (cur && rail.scrollHeight > rail.clientHeight) {
    const r = rail.getBoundingClientRect(), c = cur.getBoundingClientRect();
    if (c.top < r.top || c.bottom > r.bottom) rail.scrollTop += c.top - r.top - rail.clientHeight / 3;
  }
  if (spy) spy();
}
addEventListener('hashchange', () => showTopic(location.hash.slice(1), true));
function setLang(l) {
  if (l === lang || !known(l)) return;
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  showLang();
  render();
}
drawNav();
render();
</script></body></html>
