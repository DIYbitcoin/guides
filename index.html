<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIYbitcoin Guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Serif:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
img{max-width:100%;height:auto}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
th,td{padding:8px 10px;text-align:left;vertical-align:top}
pre{position:relative;overflow-x:auto;padding:14px 16px}
pre button.copy{position:absolute;top:8px;right:8px;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 16px}
nav a{text-decoration:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0}
.card{display:block;padding:18px;text-decoration:none}
.card h3{margin:0 0 8px}
.card p{margin:0}
details{margin:12px 0;padding:6px 14px}
summary{cursor:pointer;padding:6px 0}

.t{background:#0a0f0a;color:#b9e5c3;font:15px/1.7 'IBM Plex Mono',ui-monospace,monospace}
.t nav{border-bottom:1px solid #1f3a26;background:#0d140d}
.t nav .prompt{color:#3f7f4f}
.t nav a{color:#7dff9b}
.t nav a.on{background:#7dff9b;color:#0a0f0a;padding:0 6px}
.t h1,.t h2,.t h3{color:#7dff9b;font-weight:600;line-height:1.3}
.t h1::before{content:'> '}
.t h1::after{content:'_';animation:blink 1s steps(1) infinite}
.t h2{border-top:1px dashed #2e5a38;padding-top:22px;margin-top:40px}
.t h2::before{content:'## ';color:#3f7f4f}
.t h3::before{content:'### ';color:#3f7f4f}
@keyframes blink{50%{opacity:0}}
.t a{color:#7dff9b}
.t strong{color:#e6fff0}
.t code{background:#132013;color:#7dff9b;padding:1px 5px}
.t pre{background:#0f1a10;border:1px solid #2e5a38}
.t pre code{background:none;padding:0}
.t pre code.language-bash::before{content:'$ ';color:#3f7f4f}
.t pre button.copy{background:#0a0f0a;color:#7dff9b;border:1px solid #2e5a38;font:12px 'IBM Plex Mono',monospace}
.t th,.t td{border:1px solid #2e5a38}
.t th{color:#7dff9b}
.t img{border:1px solid #2e5a38}
.t details{border:1px solid #2e5a38}
.t summary{color:#7dff9b}
.t summary::marker{content:'[+] '}
.t details[open]>summary::marker{content:'[-] '}
.t blockquote{border-left:3px solid #7dff9b;margin:0;padding-left:14px;color:#8fcf9f}
.t .card{border:1px solid #2e5a38;color:#b9e5c3}
.t .card:hover{border-color:#7dff9b}
.t .card h3::before{content:'$ ';color:#3f7f4f}

</style></head>
<body><nav id="nav"></nav><main id="out"></main>
<script>
const q = new URLSearchParams(location.search);
const page = q.get('page') || 'home';
document.body.className = 't';
const GUIDES = [['javacards','Flashing javacards','A DIY bitcoin wallet, bearer card or seed backup on a J3H145 card.'],['signers','DIY signers','SeedSigner, Kern or KISS Signer on the Waveshare 3.5 inch touchscreen board.'],['nodes','Run your own node','Check every bitcoin rule yourself on a mini PC.']];
const href = p => p === 'home' ? './' : `?page=${p}`;
document.getElementById('nav').innerHTML =
  `<span class="prompt">diybitcoin@guides:~$</span>` +
  [['home','home']].concat(GUIDES.map(g => [g[0], g[0]])).map(([p, l]) => `<a class="${p === page ? 'on' : ''}" href="${href(p)}">${l}</a>`).join('');
const out = document.getElementById('out');
if (page === 'home') {
  out.innerHTML = `<h1>DIYbitcoin guides</h1><p>Step by step guides to do bitcoin yourself.</p><div class="cards">` +
    GUIDES.map(g => `<a class="card" href="${href(g[0])}"><h3>${g[1]}</h3><p>${g[2]}</p></a>`).join('') + `</div>`;
} else {
  fetch(`${page}/README.md`).then(r => r.text()).then(md => {
    out.innerHTML = marked.parse(md);
    out.querySelectorAll('img').forEach(i => { const s = i.getAttribute('src'); if (!/^https?:/.test(s)) i.src = `${page}/${s}`; });
    out.querySelectorAll('a').forEach(a => { const h = a.getAttribute('href') || ''; const m = h.match(/^\.\.\/(\w+)\/?$/); if (m) a.href = href(m[1]); });
    out.querySelectorAll('pre').forEach(p => { const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'copy'; b.onclick = () => { navigator.clipboard.writeText(p.innerText.replace(/\ncopy$/, '').replace(/^copy\n/, '').trim()); b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1200); }; p.appendChild(b); });
  });
}
</script></body></html>
