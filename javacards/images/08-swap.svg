<svg xmlns="http://www.w3.org/2000/svg" width="940" height="250" viewBox="0 0 940 250" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f9f6f"/>
    </marker>
  </defs>
  <rect width="940" height="250" rx="14" fill="#0a0f0a" stroke="#1f3a26"/>

  <!-- card 1 -->
  <rect x="40" y="40" width="200" height="130" rx="12" fill="#0f1a10" stroke="#7dff9b" stroke-width="2"/>
  <rect x="60" y="60" width="34" height="26" rx="4" fill="#ffb454" stroke="#c98a2e"/>
  <rect x="60" y="105" width="160" height="44" rx="8" fill="#0f1a10" stroke="#ffb454"/>
  <text x="140" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#e6fff0">Satochip</text>
  <text x="140" y="200" text-anchor="middle" font-size="14" fill="#e6fff0">PIN + 12 seed words inside</text>

  <!-- uninstall -->
  <line x1="250" y1="105" x2="360" y2="105" stroke="#5f9f6f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="305" y="90" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e6fff0">--uninstall</text>
  <text x="305" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#ff6b6b">erases the seed</text>

  <!-- card 2 -->
  <rect x="370" y="40" width="200" height="130" rx="12" fill="#0f1a10" stroke="#7dff9b" stroke-width="2"/>
  <rect x="390" y="60" width="34" height="26" rx="4" fill="#ffb454" stroke="#c98a2e"/>
  <rect x="390" y="105" width="160" height="44" rx="8" fill="#0f1a10" stroke="#3f7f4f" stroke-dasharray="6 4"/>
  <text x="470" y="133" text-anchor="middle" font-size="15" fill="#5f9f6f">empty</text>
  <text x="470" y="200" text-anchor="middle" font-size="14" fill="#e6fff0">card is fine, not bricked</text>

  <!-- install -->
  <line x1="580" y1="105" x2="690" y2="105" stroke="#5f9f6f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="635" y="90" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e6fff0">--install</text>

  <!-- card 3 -->
  <rect x="700" y="40" width="200" height="130" rx="12" fill="#0f1a10" stroke="#7dff9b" stroke-width="2"/>
  <rect x="720" y="60" width="34" height="26" rx="4" fill="#ffb454" stroke="#c98a2e"/>
  <rect x="720" y="105" width="160" height="44" rx="8" fill="#0f1a10" stroke="#5ccfe6"/>
  <text x="800" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#e6fff0">Satodime</text>
  <text x="800" y="200" text-anchor="middle" font-size="14" fill="#e6fff0">fresh, ready to set up</text>
</svg>
