<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f9f6f"/>
    </marker>
  </defs>
  <rect width="940" height="440" rx="14" fill="#0a0f0a" stroke="#1f3a26"/>

  <g transform="translate(0,30)">
  <!-- computer -->
  <rect x="30" y="120" width="190" height="120" rx="10" fill="#0f1a10" stroke="#5f9f6f" stroke-width="2"/>
  <rect x="50" y="138" width="150" height="70" rx="4" fill="#0a0f0a"/>
  <text x="62" y="162" fill="#7dff9b" font-family="ui-monospace, Menlo, monospace" font-size="13">$ gp --install</text>
  <text x="62" y="182" fill="#7dff9b" font-family="ui-monospace, Menlo, monospace" font-size="13">applet.cap</text>
  <rect x="20" y="240" width="210" height="12" rx="4" fill="#5f9f6f"/>
  <text x="125" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#e6fff0">Your computer</text>
  <text x="125" y="302" text-anchor="middle" font-size="13" fill="#5f9f6f">Java + GlobalPlatformPro</text>

  <!-- usb -->
  <line x1="232" y1="180" x2="300" y2="180" stroke="#5f9f6f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="266" y="168" text-anchor="middle" font-size="12" fill="#5f9f6f">USB</text>

  <!-- reader + card -->
  <rect x="306" y="150" width="150" height="70" rx="10" fill="#16301d"/>
  <text x="381" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#e6fff0">Smartcard reader</text>
  <rect x="331" y="70" width="100" height="110" rx="8" fill="#0f1a10" stroke="#7dff9b" stroke-width="2"/>
  <rect x="349" y="88" width="30" height="24" rx="4" fill="#ffb454" stroke="#c98a2e"/>
  <line x1="349" y1="100" x2="379" y2="100" stroke="#c98a2e"/>
  <line x1="364" y1="88" x2="364" y2="112" stroke="#c98a2e"/>
  <text x="381" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#7dff9b">J3H145</text>
  <text x="381" y="152" text-anchor="middle" font-size="11" fill="#7dff9b">javacard</text>

  </g>

  <!-- branches -->
  <line x1="460" y1="210" x2="520" y2="75" stroke="#5f9f6f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="210" x2="520" y2="170" stroke="#5f9f6f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="210" x2="520" y2="265" stroke="#5f9f6f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="210" x2="520" y2="360" stroke="#5f9f6f" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="525" y="40" width="390" height="70" rx="10" fill="#0f1a10" stroke="#ffb454" stroke-width="2"/>
    <text x="545" y="69" font-size="17" font-weight="700" fill="#e6fff0">Satochip</text>
    <text x="545" y="91" font-size="13" fill="#5f9f6f">DIY bitcoin wallet</text>
    <text x="895" y="69" text-anchor="end" font-size="13" fill="#e6fff0">set up in</text>
    <text x="895" y="91" text-anchor="end" font-size="15" font-weight="700" fill="#c98a2e">Sparrow Wallet</text>
  </g>
  <g>
    <rect x="525" y="325" width="390" height="70" rx="10" fill="#0f1a10" stroke="#c792ea" stroke-width="2"/>
    <text x="545" y="354" font-size="17" font-weight="700" fill="#e6fff0">Keycard</text>
    <text x="545" y="376" font-size="13" fill="#5f9f6f">DIY bitcoin wallet</text>
    <text x="895" y="354" text-anchor="end" font-size="13" fill="#e6fff0">set up in</text>
    <text x="895" y="376" text-anchor="end" font-size="15" font-weight="700" fill="#c792ea">Sparrow Wallet</text>
  </g>
  <g>
    <rect x="525" y="135" width="390" height="70" rx="10" fill="#0f1a10" stroke="#5ccfe6" stroke-width="2"/>
    <text x="545" y="164" font-size="17" font-weight="700" fill="#e6fff0">Satodime</text>
    <text x="545" y="186" font-size="13" fill="#5f9f6f">bearer card: seal, unseal, pass on</text>
    <text x="895" y="164" text-anchor="end" font-size="13" fill="#e6fff0">set up in</text>
    <text x="895" y="186" text-anchor="end" font-size="15" font-weight="700" fill="#5ccfe6">Sato-Tools</text>
  </g>
  <g>
    <rect x="525" y="230" width="390" height="70" rx="10" fill="#0f1a10" stroke="#7dff9b" stroke-width="2"/>
    <text x="545" y="259" font-size="17" font-weight="700" fill="#e6fff0">SeedKeeper</text>
    <text x="545" y="281" font-size="13" fill="#5f9f6f">encrypted backup for seeds and secrets</text>
    <text x="895" y="259" text-anchor="end" font-size="13" fill="#e6fff0">set up in</text>
    <text x="895" y="281" text-anchor="end" font-size="15" font-weight="700" fill="#7dff9b">Sato-Tools</text>
  </g>
</svg>
